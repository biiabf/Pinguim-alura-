<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Flashcard</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header class="cabecalho">
        <h1>Meu Flashcard</h1>
        <p>Toque no cartão para virar</p>
    </header>

    <main>

        <article class="cartao" onclick="this.classList.toggle('virado')">

            <!-- FRENTE -->
            <div class="frente">

                <img
                    class="imagem"
                    src="https://images.unsplash.com/photo-1551986782-d0169b3f8fa7?auto=format&fit=crop&w=800&q=80"
                    alt="Pinguim">

                <h2>Pinguim</h2>

                <p>Toque para descobrir!</p>

            </div>


            <!-- VERSO -->
            <div class="verso">

                <h2>Você sabia?</h2>

                <p>
                    Os pinguins são aves que não voam,
                    mas são excelentes nadadores.
                </p>

                <p>
                    Toque novamente para voltar.
                </p>

            </div>

        </article>

    </main>

</body>

</html>
